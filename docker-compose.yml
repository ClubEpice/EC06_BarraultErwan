services:
  app:
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: npm start

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - trustipro_data:/var/lib/postgresql/data

volumes:
  trustipro_data:
